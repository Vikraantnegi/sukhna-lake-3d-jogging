      <stop offset="0" stop-color="#e39650"/>
      <stop offset="1" stop-color="#f4d7a8"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa6bb"/>
      <stop offset="1" stop-color="#6f7d97"/>
    </linearGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#sky)"/>
    <circle cx="32" cy="38" r="13" fill="#ffd55a"/>
    <path d="M-2 36 Q18 30 36 34 T66 33 V40 H-2 Z" fill="#7d8aa3"/>
    <rect y="38" width="64" height="26" fill="url(#lake)"/>
    <rect x="22" y="43" width="20" height="2.6" rx="1.3" fill="#ffe7a0" opacity=".85"/>
    <rect x="26" y="48.5" width="12" height="2.2" rx="1.1" fill="#ffe7a0" opacity=".6"/>
    <path d="M-2 58 L66 52 V66 H-2 Z" fill="#2f3346"/>
  </g>
</svg>
