<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sukhna — a sunrise jog around Sukhna Lake</title>
<meta name="description" content="A winter-morning jog along the dam at Sukhna Lake, Chandigarh, at its real shape and scale: the promenade and shore from OpenStreetMap, the Shivalik hills from elevation data, a real sunrise, in a cel-shaded anime style." />
<meta name="theme-color" content="#6fa3f5" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #c9dcee;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, 'Noto Sans Devanagari', 'Nirmala UI', 'Noto Sans Gurmukhi', sans-serif;
    color: #2a2d38;
  }
  #view { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .hud { position: fixed; inset: 0; pointer-events: none; }

  /* ---------- the hint bar (plan §6): dark translucent strip, thin top line, grey text ---------- */
  .hintbar {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 7px 12px calc(7px + env(safe-area-inset-bottom));
    background: rgba(14,16,22,.58);
    border-top: 1px solid rgba(255,255,255,.16);
    color: #b9bdc7; font-size: 12.5px; letter-spacing: .01em; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: opacity .4s ease;
  }
  .hintbar.off, .jog.off { opacity: 0; }

  /* ---------- jog HUD (top left) ---------- */
  .jog {
    position: absolute; left: 14px; top: 12px;
    min-width: 214px; padding: 9px 12px 10px;
    background: rgba(14,16,22,.5); border: 1px solid rgba(255,255,255,.12); border-radius: 8px;
    color: #e8eaf0; font-size: 12px; transition: opacity .4s ease;
  }
  .jog i { display: block; font-style: normal; color: #9aa0ad; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
  .jog b { font: 600 17px/1.2 ui-monospace, 'Cascadia Mono', Consolas, monospace; }
  .jog small { color: #9aa0ad; margin-left: 2px; }
  .jog-clock { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .jog-clock b { font-size: 15px; }
  .jog-clock span { color: #c9ccd6; font-size: 11px; }
  .jog-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
  .stamina { margin-top: 8px; }
  .stamina span { display: block; height: 6px; margin-top: 3px; background: rgba(255,255,255,.14); border-radius: 3px; overflow: hidden; }
  .stamina em { display: block; height: 100%; width: 100%; background: #7fd18a; transition: width .25s linear, background .3s; }
  .stamina em.low { background: #f08a4e; }
  .jog-mode { margin-top: 6px; color: #f2c230; font-size: 11px; min-height: 13px; }

  /* ---------- prompt, toast, speech bubble ---------- */
  .prompt, .toast {
    position: absolute; left: 50%; transform: translate(-50%, 6px);
    padding: 7px 16px; border-radius: 999px;
    background: rgba(14,16,22,.62); color: #eef0f5; font-size: 13.5px; font-weight: 600;
    white-space: nowrap; opacity: 0; transition: opacity .2s ease, transform .2s ease;
  }
  .prompt { bottom: 17%; }
  .toast { top: 11%; }
  .prompt.on, .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .bubble {
    position: absolute; transform: translate(-50%, -100%);
    padding: 5px 11px; border-radius: 12px; background: #fbfaf6; color: #2a2d38;
    font-size: 13px; font-weight: 600; box-shadow: 0 2px 0 rgba(0,0,0,.18);
    opacity: 0; transition: opacity .2s ease; white-space: nowrap;
  }
  .bubble.on { opacity: 1; }

  /* ---------- coordinates (C, dev) and ?stats=1 ---------- */
  .coords, .stats {
    position: fixed; padding: 6px 10px; border-radius: 6px;
    background: rgba(14,16,22,.58); color: #d9dce4;
    font: 12px/1.45 ui-monospace, 'Cascadia Mono', Consolas, monospace;
    white-space: pre; pointer-events: none; z-index: 10;
  }
  .coords { right: 12px; bottom: 40px; opacity: 0; }
  .coords.on { opacity: 1; }
  .stats { right: 12px; top: 12px; }

  /* ---------- start / pause card ---------- */
  .overlay {
    position: absolute; inset: 0; pointer-events: auto;
    display: grid; place-items: center; padding: 16px;
    background: linear-gradient(160deg, rgba(40,48,78,.55), rgba(231,163,90,.28) 55%, rgba(201,224,247,.35));
    backdrop-filter: blur(6px) saturate(.9);
    transition: opacity .45s ease, visibility .45s ease;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .card {
    display: grid; grid-template-columns: 200px minmax(0, 1fr);
    width: min(760px, 100%); overflow: hidden;
    background: #fbf7ee; border: 2px solid #2f3346; border-radius: 6px;
    box-shadow: 8px 10px 0 rgba(47,51,70,.25);
  }
  .card-art { position: relative; min-height: 360px; background: linear-gradient(#e7a35a, #f4d7a8 55%, #c9d7e6 56%); overflow: hidden; border-right: 2px solid #2f3346; }
  .card-art .sun { position: absolute; left: 58%; top: 40%; width: 46px; height: 46px; margin: -23px; border-radius: 50%; background: #ffd55a; box-shadow: 0 0 40px 12px rgba(255,213,90,.5); }
  .card-art .ridge { position: absolute; left: -10%; right: -10%; height: 90px; border-radius: 50% 50% 0 0; }
  .card-art .r1 { top: 44%; background: #a9b3c6; transform: scaleX(1.4); }
  .card-art .r2 { top: 49%; background: #7d8aa3; left: -40%; }
  .card-art .water { position: absolute; left: 0; right: 0; top: 56%; bottom: 0; background: linear-gradient(#d7b99a, #8c96a6); }
  .card-art .dam { position: absolute; left: -20%; right: -20%; bottom: 18%; height: 18px; background: #9a978d; border-top: 5px solid #b9b3a4; transform: rotate(-6deg); }
  .card-copy { padding: 28px 30px 22px; display: flex; flex-direction: column; gap: 10px; }
  .kicker { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #8a6a4a; }
  .card h1 { margin: 0; font-size: 46px; line-height: 1; letter-spacing: -.02em; color: #2f3346; }
  .names { font-size: 17px; color: #5a5f73; }
  .card p { margin: 2px 0; font-size: 13.5px; line-height: 1.6; color: #4a4f60; }
  .pause-only { display: none; }
  .overlay[data-mode='paused'] .start-only { display: none; }
  .overlay[data-mode='paused'] .pause-only { display: initial; }
  .outfits { display: flex; flex-wrap: wrap; gap: 8px; }
  .outfits button {
    display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px;
    border: 1.5px solid #c9c2b2; border-radius: 6px; background: #fff; cursor: pointer; font: inherit; font-size: 12px; color: #3a3f50;
  }
  .outfits button[aria-checked='true'] { border-color: #2f3346; box-shadow: 2px 2px 0 #2f3346; }
  .outfits span { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); }
  .outfits em { font-style: normal; margin-left: 4px; }
  .controls { font-size: 11.5px; color: #6a6f80; line-height: 1.6; }
  .go {
    margin-top: 6px; padding: 11px 16px; border: 2px solid #2f3346; border-radius: 6px;
    background: #e8542f; color: #fff; font: inherit; font-size: 15px; font-weight: 700; letter-spacing: .04em; cursor: pointer;
    box-shadow: 4px 4px 0 #2f3346;
  }
  .go:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #2f3346; }
  .credits { font-size: 10.5px; color: #8a8e9a; }

  /* ---------- touch ---------- */
  .touch { position: fixed; inset: 0; pointer-events: none; }
  .stick { position: absolute; left: 22px; bottom: 56px; width: 130px; height: 130px; border-radius: 50%; background: rgba(14,16,22,.28); border: 1px solid rgba(255,255,255,.3); pointer-events: auto; touch-action: none; }
  .knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px; border-radius: 50%; background: rgba(255,255,255,.7); }
  .tbuttons { position: absolute; right: 14px; bottom: 56px; display: grid; grid-template-columns: repeat(4, 44px); gap: 8px; pointer-events: auto; }
  .tbuttons button { height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); background: rgba(14,16,22,.45); color: #fff; font-weight: 700; font-size: 15px; touch-action: none; }

  /* ---------- ?flat=1 map panel (world/flat.js) ---------- */
  .flatpanel {
    position: fixed; right: 0; top: 0; bottom: 0; width: 42vw;
    background: rgba(245,243,236,.96); border-left: 1px solid rgba(0,0,0,.2);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; z-index: 5;
  }
  .flatpanel canvas { max-width: 100%; }
  .flatinfo { font: 12px ui-monospace, Consolas, monospace; color: #333; }

  @media (max-width: 640px) {
    .card { grid-template-columns: 1fr; }
    .card-art { min-height: 110px; border-right: 0; border-bottom: 2px solid #2f3346; }
    .card-copy { padding: 18px 18px 16px; }
    .card h1 { font-size: 36px; }
    .jog { min-width: 0; left: 8px; top: 8px; padding: 7px 9px; }
    .jog b { font-size: 14px; }
    .hintbar { font-size: 10.5px; }
  }
</style>
</head>
<body>
  <canvas id="view"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
